<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#58a6ff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Card background -->
  <rect x="300" y="115" width="600" height="400" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top accent bar -->
  <rect x="300" y="115" width="600" height="4" rx="2" fill="url(#accent)"/>

  <!-- Badge pill -->
  <rect x="524" y="165" width="152" height="28" rx="14" fill="rgba(88,166,255,0.12)" stroke="rgba(88,166,255,0.35)" stroke-width="1"/>
  <text x="600" y="184" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#58a6ff">FIRST REPO</text>

  <!-- Main title -->
  <text x="600" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#e6edf3">alex</text>
  <text x="600" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-2">
    <tspan fill="#e6edf3">alex</tspan><tspan fill="#58a6ff">test</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8b949e">A first foothold in version control</text>

  <!-- Divider -->
  <line x1="400" y1="355" x2="800" y2="355" stroke="#30363d" stroke-width="1"/>

  <!-- Stats row -->
  <text x="440" y="390" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="24" font-weight="700" fill="#e6edf3">2</text>
  <text x="440" y="412" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">commits</text>

  <line x1="600" y1="370" x2="600" y2="420" stroke="#30363d" stroke-width="1"/>

  <text x="600" y="390" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="24" font-weight="700" fill="#e6edf3">1</text>
  <text x="600" y="412" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">file</text>

  <line x1="760" y1="370" x2="760" y2="420" stroke="#30363d" stroke-width="1"/>

  <text x="760" y="390" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="24" font-weight="700" fill="#3fb950">●</text>
  <text x="760" y="412" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">active</text>

  <!-- Footer -->
  <text x="600" y="470" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#484f58">woodhouse711/alextest · 2024-08-20</text>

  <!-- Corner decoration dots -->
  <circle cx="320" cy="135" r="3" fill="#30363d"/>
  <circle cx="340" cy="135" r="3" fill="#30363d"/>
  <circle cx="360" cy="135" r="3" fill="#30363d"/>
</svg>
